project:
  type: book
  output-dir: docs

book:
  title: "Applied Regression Analysis for Empirical Research: Inference, Causality, and Model Choice with GLMMs in R"
  author: 
     name: "Florian Hartig"
     url: https://www.uni-regensburg.de/biologie-vorklinische-medizin/theoretische-oekologie/mitarbeiter/hartig/
  date: "Jun 2026"
  site-url: https://TheoreticalEcology.github.io/AdvancedRegressionModels/
  repo-url: https://github.com/TheoreticalEcology/AdvancedRegressionModels
  repo-branch: main
  repo-actions: [edit]
  sharing: [twitter, facebook, linkedin]
  chapters:
    - index.qmd
    - 1A-GettingStarted.qmd
    - part: "Modeling the mean"
      chapters: 
      - 2A-LinearRegression.qmd
      - 2B-ANOVA.qmd
      - 2C-RandomEffects.qmd
      - 2D-NonlinearRegression.qmd
    - part: "Model choice"
      chapters: 
      - 3A-MissingData.qmd
      - 3B-CausalInference.qmd
      - 3C-ModelSelection.qmd
    - part: "Modeling the distribution"
      chapters: 
      - 4A-GLMs.qmd    
      - 4B-Heteroskedasticity.qmd
      - 4C-CorrelationStructures.qmd
    - part: "Workflow"
      chapters: 
      - 5A-Summary.qmd   
  appendices:
    - 5B-References.qmd
    - 6B-CheatSheet.qmd
    - 6C-CaseStudies.qmd

engine: knitr
  
bibliography: literature.bib
csl: csl/harvard-cite-them-right.csl
google-scholar: true

execute:
  freeze: auto
  cache: false

format:
  html:
    theme: cosmo
    css: styles.css
    citation-location: margin
    include-after-body: margin-refs.html
    link-external-newwindow: true
editor: visual


